set -g default-terminal "foot"
set -ga terminal-overrides ",foot:Tc"

set -g status-style bg=default
set -g window-style bg=default
set -g window-active-style bg=default
set -g pane-border-style bg=default
set -g pane-active-border-style bg=default

# [Window Naming]
# Verhindert, dass Zsh/Programme die tmuxinator-Fensternamen überschreiben
set-option -g allow-rename off
set-window-option -g automatic-rename off
set -g set-titles off

# [Keybinds]


# Change default prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
# -----------------------------------------------------------------------------
# Keybinds angepasst an deutsches Layout (QWERTZ)
# -----------------------------------------------------------------------------

# 1. Fenstersplits (Ersetzt die fummeligen Standardtasten " und %)
# Vertikaler Split: Prefix + - (Minus liegt direkt neben der rechten Umschalttaste)
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Horizontaler Split: Prefix + b (Bequem mit links) oder Prefix + ö
unbind %
bind b split-window -h -c "#{pane_current_path}"
# Alternativ mit Umlaut direkt auf der Tastatur:
# bind ö split-window -h -c "#{pane_current_path}"

# 2. Copy-Mode / Scroll-Modus (Standard ist Prefix + [, auf QWERTZ sehr umständlich mit Alt Gr + 8)
# Neuer Einstieg in den Scroll-Modus: Prefix + Esc oder Prefix + s
bind Escape copy-mode
bind s copy-mode

# 3. Vi-Mode für Scrolling & Copy/Paste (hjkl wie in Vim)
set-window-option -g mode-keys vi

# Kopieren wie in Vim (v zum Markieren, y zum Kopieren)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"  # für Wayland (foot)
# Falls X11 genutzt wird: "xclip -in -selection clipboard"

# Einfügen mit Prefix + p (statt ])
bind p paste-buffer

# 4. Pane-Navigation ohne Prefix (Alt + hjkl direkt drücken)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 5. Fenster wechseln ohne Shift / Prefix
# Alt + ü / Alt + ä oder Alt + n / Alt + p
bind -n M-n next-window
bind -n M-p previous-window

# 6. Panes vergrößern / verkleinern (Resize mit Prefix + Pfeiltasten)
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

set-option -g status-position top

# [Catppuccin Config]
set -g @catppuccin_window_left_separator   "█"
set -g @catppuccin_window_right_separator  "█ "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position  "right"

# WICHTIG: Beide Styles explizit auf #W setzen (sowohl v0.x als auch v1.x/v2.x Syntax)
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

set -g @catppuccin_status_modules_right    "directory session"
set -g @catppuccin_status_left_separator   " █"
set -g @catppuccin_status_right_separator  "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill             "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text          "#{pane_current_path}"

# [Plugins]
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (muss zwingend die LETZTE Zeile sein)
run '~/.tmux/plugins/tpm/tpm'

# Override: Erzwingt #W im von Catppuccin generierten Format
set-window-option -g window-status-format "#[fg=#{@thm_surface_1},bg=default]#{E:@catppuccin_window_left_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W #[fg=#{@thm_surface_1},bg=#{@thm_overlay_0}]#{E:@catppuccin_window_middle_separator}#[fg=#{@thm_bg},bg=#{@thm_overlay_0}] #I #[fg=#{@thm_overlay_0},bg=default]#{E:@catppuccin_window_right_separator}"
